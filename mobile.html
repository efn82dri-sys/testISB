<script>
/* انتخاب نسخه: موبایل -> mobile.html ، دسکتاپ -> index.html
   برای تست دستی: آدرس را با ?view=mobile یا ?view=desktop باز کنید */
(function(){
  try{
    var p=/[?&]view=(mobile|desktop)/.exec(location.search), v=null;
    if(p){v=p[1];sessionStorage.setItem('isbView',v)}else{v=sessionStorage.getItem('isbView')}
    var m=window.matchMedia("(max-width: 768px), (pointer: coarse) and (max-width: 1024px)").matches;
    if(v==='desktop'||(!m && v!=='mobile')){
      var q=location.search.replace(/([?&])view=(mobile|desktop)&?/,'$1').replace(/[?&]$/,'');
      location.replace("index.html"+q+location.hash);
    }
  }catch(e){}
})();
</script>
